{% extends "base.html" %}
{% block title %}Add Blood Unit | Blood Bank Inventory{% endblock %}
{% block content %}
<section class="page-heading">
    <h1>Add Blood Unit</h1>
    <p>Enter a unique unit ID, blood group, and expiry date.</p>
</section>
<section class="panel form-panel">
    <form method="POST">
        <label for="unit_code">Blood Unit ID</label>
        <input type="text" id="unit_code" name="unit_code" placeholder="Example: B001" required>

        <label for="blood_group">Blood Group</label>
        <select id="blood_group" name="blood_group" required>
            <option value="">Select blood group</option>
            {% for group in blood_groups %}
            <option value="{{ group }}">{{ group }}</option>
            {% endfor %}
        </select>

        <label for="expiry_date">Expiry Date</label>
        <input type="date" id="expiry_date" name="expiry_date" min="{{ today }}" required>

        <button class="button" type="submit">Add Blood Unit</button>
    </form>
</section>
{% endblock %}
